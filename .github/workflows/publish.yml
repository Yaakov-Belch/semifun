name: Publish to PyPI and NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-semifun:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Build semifun
      run: |
        python -m pip install build
        rm -rf dist/
        python -m build

    - name: Publish semifun to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-tmsgpack:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Build tmsgpack sdist
      run: |
        cd tmsgpack
        python -m pip install build
        rm -rf dist/
        python -m build --sdist

    - name: Publish tmsgpack to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: tmsgpack/dist/

  publish-tmsgpack-js:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    - name: Publish to NPM
      run: npm publish --provenance
      working-directory: ./tmsgpack-js
